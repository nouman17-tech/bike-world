<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Bike World</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <i class="fas fa-motorcycle"></i> Bike World
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                </ul>
                <a href="index.html" class="btn btn-secondary btn-sm">Back</a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <section class="cart-section">
        <div class="container">
            <h1>Shopping Cart</h1>
            <div class="cart-content">
                <div class="cart-items" id="cartItems"></div>
                <div class="cart-summary">
                    <div class="summary-card">
                        <h3>Order Summary</h3>
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">PKR 0</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping:</span>
                            <span>PKR 500</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total:</span>
                            <span id="total">PKR 500</span>
                        </div>
                        <button class="btn btn-primary btn-block" id="checkoutBtn">Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Bike World. Created by <strong>Nouman Ijaz</strong></p>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        function displayCart() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const cartItems = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="empty-cart">Your cart is empty. <a href="products.html">Continue shopping</a></p>';
                document.getElementById('checkoutBtn').disabled = true;
                return;
            }
            
            let html = '';
            let subtotal = 0;
            
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-details">
                            <h3>${item.name}</h3>
                            <p>PKR ${item.price}</p>
                        </div>
                        <div class="item-quantity">
                            <button onclick="updateQuantity(${index}, -1)">-</button>
                            <input type="number" value="${item.quantity}" min="1">
                            <button onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                        <div class="item-total">PKR ${itemTotal}</div>
                        <button class="btn-remove" onclick="removeFromCart(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
            
            cartItems.innerHTML = html;
            document.getElementById('subtotal').textContent = `PKR ${subtotal}`;
            document.getElementById('total').textContent = `PKR ${subtotal + 500}`;
        }
        
        function updateQuantity(index, change) {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart[index]) {
                cart[index].quantity = Math.max(1, cart[index].quantity + change);
                localStorage.setItem('cart', JSON.stringify(cart));
                displayCart();
            }
        }
        
        function removeFromCart(index) {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }
        
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            const user = localStorage.getItem('user');
            if (!user) {
                alert('Please login to checkout');
                window.location.href = 'login.html';
            } else {
                window.location.href = 'checkout.html';
            }
        });
        
        displayCart();
    </script>
</body>
</html>
