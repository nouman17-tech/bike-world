<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Bike World Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-page">
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <h3><i class="fas fa-cog"></i> Admin Panel</h3>
            <ul>
                <li><a href="admin-dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="admin-products.html" class="active"><i class="fas fa-box"></i> Products</a></li>
                <li><a href="admin-orders.html"><i class="fas fa-shopping-bag"></i> Orders</a></li>
                <li><a href="#" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-header">
                <h1>Product Management</h1>
                <button class="btn btn-primary" onclick="toggleForm()">+ Add New Product</button>
            </div>

            <!-- Add/Edit Product Form -->
            <div class="admin-section" id="productForm" style="display: none;">
                <h2>Add New Product</h2>
                <form id="addProductForm" class="product-form">
                    <div class="form-group">
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option>Engine Oil</option>
                            <option>Brakes</option>
                            <option>Filters</option>
                            <option>Drivetrain</option>
                            <option>Ignition</option>
                            <option>Electrical</option>
                            <option>Tires</option>
                            <option>Transmission</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price">Price (PKR) *</label>
                        <input type="number" id="price" name="price" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity" name="quantity" required>
                    </div>

                    <div class="form-group form-full">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Product description"></textarea>
                    </div>

                    <div class="form-group form-full">
                        <label for="image">Product Image</label>
                        <input type="file" id="image" name="image" accept="image/*">
                    </div>

                    <div style="grid-column: 1 / -1; display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary">Save Product</button>
                        <button type="button" class="btn btn-secondary" onclick="toggleForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Products Table -->
            <div class="admin-section">
                <h2>All Products</h2>
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: #999;">Loading products...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        let products = [];
        let editingProductId = null;

        // Check admin authentication
        function checkAdminAuth() {
            const admin = localStorage.getItem('admin');
            if (!admin) {
                window.location.href = 'admin-login.html';
            }
        }

        // Toggle form visibility
        function toggleForm() {
            const form = document.getElementById('productForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            if (form.style.display === 'block') {
                document.getElementById('addProductForm').reset();
                editingProductId = null;
            }
        }

        // Load products
        async function loadProducts() {
            try {
                products = await api.getProducts();
                displayProducts();
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        // Display products in table
        function displayProducts() {
            const tableBody = document.getElementById('productsTableBody');
            if (products.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">No products found</td></tr>';
                return;
            }

            let html = '';
            products.forEach(product => {
                html += `
                    <tr>
                        <td><img src="${product.image || 'https://via.placeholder.com/50x50'}" alt=""></td>
                        <td>${product.name}</td>
                        <td>${product.category}</td>
                        <td>PKR ${product.price}</td>
                        <td>${product.quantity}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-edit" onclick="editProduct('${product._id}')"><i class="fas fa-edit"></i> Edit</button>
                                <button class="btn-delete" onclick="deleteProduct('${product._id}')"><i class="fas fa-trash"></i> Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        }

        // Edit product
        function editProduct(id) {
            const product = products.find(p => p._id === id);
            if (product) {
                document.getElementById('productName').value = product.name;
                document.getElementById('category').value = product.category;
                document.getElementById('price').value = product.price;
                document.getElementById('quantity').value = product.quantity;
                document.getElementById('description').value = product.description || '';
                editingProductId = id;
                document.getElementById('productForm').style.display = 'block';
                document.querySelector('.admin-section h2').textContent = 'Edit Product';
            }
        }

        // Delete product
        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                try {
                    await api.deleteProduct(id);
                    alert('Product deleted successfully');
                    loadProducts();
                } catch (error) {
                    alert('Error deleting product: ' + error.message);
                }
            }
        }

        // Handle form submission
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('name', document.getElementById('productName').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('quantity', document.getElementById('quantity').value);
            formData.append('description', document.getElementById('description').value);
            
            const imageInput = document.getElementById('image');
            if (imageInput.files.length > 0) {
                formData.append('image', imageInput.files[0]);
            }

            try {
                if (editingProductId) {
                    await api.updateProduct(editingProductId, formData);
                    alert('Product updated successfully');
                } else {
                    await api.addProduct(formData);
                    alert('Product added successfully');
                }
                toggleForm();
                loadProducts();
            } catch (error) {
                alert('Error saving product: ' + error.message);
            }
        });

        // Admin logout
        function adminLogout() {
            localStorage.removeItem('admin');
            alert('Logged out successfully');
            window.location.href = 'admin-login.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminAuth();
            loadProducts();
        });
    </script>
</body>
</html>
