<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Bike World</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <nav class="navbar">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo" aria-label="Bike World Home">
        <div class="logo-mark"><i class="fas fa-motorcycle"></i></div>
        <div class="logo-text">Bike World</div>
      </a>
      <a href="index.html" class="btn btn-secondary btn-sm">Back to Home</a>
    </div>
  </nav>

  <section class="auth-container">
    <div class="auth-box">
      <h1>Login to Your Account</h1>
      <p>Enter your credentials to continue shopping</p>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
      <p class="auth-link">Admin? <a href="admin-login.html">Admin Login</a></p>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();

        if (response.ok) {
          localStorage.setItem('user', JSON.stringify(result.user));
          alert('Login successful!');
          window.location.href = 'index.html';
        } else {
          alert(result.error || 'Login failed');
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    });
  </script>
</body>
</html>
